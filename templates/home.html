{% load static %}

<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MainControl — Disciplina A</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="shortcut icon" href="{% static 'img/icon.png' %}" type="image/x-icon">
    <script src="{% static 'js/script.js' %}" defer></script>
</head>

<body>
<div class="caixa">
    <header>
        <div class="logotipo"><img src="{% static 'img/icon.png' %}" alt="Ícone MainControl">MainControl<br>Disciplina A</div>
    </header>
    
    <p class="subtitulo">Controle em tempo real de salas abertas, fechadas e da posse das chaves.</p>

    <section class="estatisticas" aria-label="Resumo">
        <div class="estatistica-item"><b id="sAb">0</b><small>Salas abertas</small></div>
        <div class="estatistica-item"><b id="sFe">0</b><small>Salas fechadas</small></div>
        <div class="estatistica-item"><b id="sCh">0</b><small>Chaves emprestadas</small></div>
        <div class="estatistica-item"><b id="sTo">15</b><small>Total de salas</small></div>
    </section>

    <div class="ferramentas">
        <input id="busca" type="search" placeholder="Buscar sala, usúario ou responsável…">
        <button data-f="todas" class="ativo">Todas</button>
        <button data-f="abertas">Abertas</button>
        <button data-f="fechadas">Fechadas</button>
        <button data-f="fora">Chave fora</button>
    </div>

    <div class="grade" id="grid">
        <button>SALA 1<br><p>❔ Sem Informações</p></button>
        <button>SALA 2<br><p>❔ Sem Informações</p></button>
        <button id="botão-3" onclick="alternarStatusSala(3, '#aviso-sala-03')">SALA 3 <br><p id="aviso-sala-03"></p></button>
        <button id="botão-4" onclick="alternarStatusSala(4, '#aviso-sala-04')">SALA 4 <br><p id="aviso-sala-04"></p></button>
        <button id="botão-5" onclick="alternarStatusSala(5, '#aviso-sala-05')">SALA 5 <br><p id="aviso-sala-05"></p></button>
        <button id="botão-6" onclick="alternarStatusSala(6, '#aviso-sala-06')">SALA 6 <br><p id="aviso-sala-06"></p></button>
        <button>SALA 7<br><p>❔ Sem Informações</p></button>
        <button id="botão-8" onclick="alternarStatusSala(8, '#aviso-sala-08')">SALA 8 <br><p id="aviso-sala-08"></p></button>
        <button id="botão-9" onclick="alternarStatusSala(9, '#aviso-sala-09')">SALA 9 <br><p id="aviso-sala-09"></p></button>
        <button>SALA 10<br><p>❔ Sem Informações</p></button>
        <button id="botão-11" onclick="alternarStatusSala(11, '#aviso-sala-11')">SALA 11 <br><p id="aviso-sala-11"></p></button>
        <button id="botão-12" onclick="alternarStatusSala(12, '#aviso-sala-12')">SALA 12 <br><p id="aviso-sala-12"></p></button>
        <button id="botão-13" onclick="alternarStatusSala(13, '#aviso-sala-13')">SALA 13 <br><p id="aviso-sala-13"></p></button>
        <button id="botão-14" onclick="alternarStatusSala(14, '#aviso-sala-14')">SALA 14 <br><p id="aviso-sala-14"></p></button>
        <button>SALA 15<br><p>❔ Sem Informações</p></button>
    </div>

    <h2>Histórico de atividades</h2>
    <ul id="historico"></ul>

</div>
</body>

</html>
